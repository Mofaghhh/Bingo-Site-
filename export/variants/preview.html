<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<title>Варианты лого</title>
	<style>
		body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; background: #101216; color: #e8e8ea; }
		h1 { font-size: 18px; }
		.row { display: flex; gap: 24px; flex-wrap: wrap; }
		.cell { text-align: center; }
		.cell p { margin: 8px 0 0; font-size: 13px; color: #aab; }
		.dark, .light { display: flex; align-items: center; justify-content: center; width: 180px; height: 180px; border-radius: 12px; }
		.dark { background: #14161a; }
		.light { background: #f4f1ea; margin-top: 8px; }
	</style>
</head>
<body>
	<h1>Тёмный фон (как сайт) и светлый фон (как Modrinth)</h1>
	<div class="row">
		<div class="cell"><div class="dark"><img width="128" src="no-outline.png" /></div><div class="light"><img width="128" src="no-outline.png" /></div><p>Без обводки</p></div>
		<div class="cell"><div class="dark"><img width="128" src="gold-outline.png" /></div><div class="light"><img width="128" src="gold-outline.png" /></div><p>Тёмно-золотая обводка</p></div>
		<div class="cell"><div class="dark"><img width="128" src="thin-white-outline.png" /></div><div class="light"><img width="128" src="thin-white-outline.png" /></div><p>Тонкая белая обводка</p></div>
		<div class="cell"><div class="dark"><img width="128" src="white-outline.png" /></div><div class="light"><img width="128" src="white-outline.png" /></div><p>Белая (текущая)</p></div>
	</div>
</body>
</html>
